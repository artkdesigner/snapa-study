<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snapa — modern instant camera</title>
    <meta
      name="description"
      content="Snapa is a modern instant camera with clean design, a high-quality display, large-format prints and creative presets."
    />
    <meta name="theme-color" content="#010d18" />
    <!-- SEO: основной адрес — свой поддомен на VPS (копия на GitHub Pages
         ссылается сюда же через canonical). Абсолютные URL обязательны
         для canonical и превью. -->
    <link rel="canonical" href="https://snapa.art-kalinin-design.ru/" />
    <!-- Превью ссылки в мессенджерах и соцсетях (public/og-image.jpg —
         фрейм Opengraph из Figma 1200×630, JPEG: WebP понимают не все) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Snapa" />
    <meta property="og:url" content="https://snapa.art-kalinin-design.ru/" />
    <meta property="og:title" content="Snapa — modern instant camera" />
    <meta
      property="og:description"
      content="Snapa is a modern instant camera with clean design, a high-quality display, large-format prints and creative presets."
    />
    <meta
      property="og:image"
      content="https://snapa.art-kalinin-design.ru/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Snapa wordmark over a white instant camera on rocks in warm light"
    />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Микроразметка: цены на сайте нет, а Product без offers Google
         считает ошибкой — поэтому WebSite -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Snapa",
        "url": "https://snapa.art-kalinin-design.ru/",
        "description": "Snapa is a modern instant camera with clean design, a high-quality display, large-format prints and creative presets.",
        "inLanguage": "en"
      }
    </script>
    <!-- Шрифт первого экрана (заголовок Hero) — качать сразу, а не после
         разбора CSS. Kobzar KS нужен только ниже (Choose), его не трогаем. -->
    <link
      rel="preload"
      href="/src/assets/fonts/GeneralSans-Medium.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Фон прелоудера (--color-dark) с первого кадра: index.css приходит
         позже (в dev — только после запуска JS), без этого мелькает белый. -->
    <style>
      html {
        background-color: #010d18;
      }
    </style>
    <!-- Прокрутку после перезагрузки браузер не восстанавливает — это
         делает сам сайт (src/lib/scrollMemory.ts) в известный момент, под
         прелоудером. Здесь, до любых скриптов: браузер может восстановить
         позицию раньше, чем запустится React. -->
    <script>
      history.scrollRestoration = 'manual'
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Сайт рисует JS; без него (часть поисковых и соцсетевых роботов)
         страница была бы пустой — хотя бы суть текстом -->
    <noscript>
      <div style="padding: 1.25rem; color: #fffdff; font-family: sans-serif">
        <h1>Snapa — modern instant camera</h1>
        <p>
          A modern instant camera with clean design, a high-quality display,
          large-format prints and creative presets. Enable JavaScript to view
          the full site.
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
